name: Publish container image

# Paired JSR publication is a separate tag workflow. Do not announce a verified
# release here: .github/workflows/verify-published.yml runs only after both succeed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check out audited MCP View kit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Casys-AI/mcp-server
          ref: b08802df353bb25d25a1c8d64b22ea61b5287ae0
          path: .deps/mcp-server
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.6
      - name: Confirm exact tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          test "$TAG_NAME" = "v$version"
      - name: Rebuild and verify committed MCP Apps
        env:
          MCP_VIEW_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view/mod.ts
          MCP_VIEW_CONTRACTS_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view-contracts/mod.ts
          MCP_VIEW_COMPONENTS_MODULE: file://${{ github.workspace }}/.deps/mcp-server/packages/view-components/mod.ts
        run: |
          deno task build:ui
          git diff --exit-code -- src/ui/dist
      - name: Verify package and release archive
        run: |
          deno task check
          deno task fmt
          deno task lint
          deno task test
          deno publish --dry-run
      - name: Build and smoke the native AMD64 final image
        run: |
          test "$(uname -m)" = x86_64
          docker build --target final --tag mcp-modelica:release-check .
          bash scripts/smoke-container-http.sh mcp-modelica:release-check "$(node -p 'require("./deno.json").version')" 2.9.6
          node scripts/smoke-container-stdio.mjs mcp-modelica:release-check "$(node -p 'require("./deno.json").version')" 2.9.6

  publish:
    needs: release-gate
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@a492c6d04fd3315f67230809b44d60cc0acd50b3
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      setup-qemu: false
      target: final
      sign: "true"
      meta-images: ghcr.io/superworldsavior/mcp-modelica
      meta-tags: |
        type=match,pattern=v(.*),group=1
        type=sha,format=long,prefix=sha-
      meta-flavor: latest=false
      set-meta-labels: true
      meta-labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.title=mcp-modelica
        org.opencontainers.image.description=Approved OpenModelica MCP simulation sidecar
        org.opencontainers.image.licenses=MIT
        io.casys.mcp-modelica.deno-version=2.9.6
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
